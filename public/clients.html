<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - PayShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/dashboard" class="navbar-brand">PayShield</a>
      <ul class="navbar-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/clients" class="active">Clients</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/quotes">Quotes</a></li>
        <li><a href="/invoices">Invoices</a></li>
        <li><a href="/payments">Payments</a></li>
        <li><a href="/expenses">Expenses</a></li>
        <li><a href="/cashflow">Cash Flow</a></li>
        <li><a href="/reports">Reports</a></li>
        <li><a href="/insights">Insights</a></li>
        <li><a href="/settings">Settings</a></li>
        <li><button onclick="logout()" class="btn btn-outline btn-sm">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 2rem 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1>Clients</h1>
      <button onclick="openModal()" class="btn btn-primary">Add Client</button>
    </div>

    <div class="card">
      <input type="text" id="searchInput" class="form-control" placeholder="Search clients..." style="margin-bottom: 1rem;" onkeyup="searchClients()">
      <div id="clientsList">
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Country</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="clientsTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="clientModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Client</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="clientForm">
        <input type="hidden" id="clientId">
        <div class="form-group">
          <label for="clientName">Name *</label>
          <input type="text" id="clientName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="clientEmail">Email</label>
          <input type="email" id="clientEmail" class="form-control">
        </div>
        <div class="form-group">
          <label for="clientPhone">Phone</label>
          <input type="text" id="clientPhone" class="form-control">
        </div>
        <div class="form-group">
          <label for="clientAddress">Address</label>
          <input type="text" id="clientAddress" class="form-control">
        </div>
        <div class="form-group">
          <label for="clientCountry">Country</label>
          <input type="text" id="clientCountry" class="form-control">
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="clientDetailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Client Details</h2>
        <button onclick="closeDetailModal()" class="modal-close">&times;</button>
      </div>
      <div id="clientDetailContent"></div>
      <div class="modal-footer">
        <button onclick="closeDetailModal()" class="btn btn-primary">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    checkAuth();
    let allClients = [];

    async function loadClients() {
      try {
        const result = await apiCall('/clients');
        allClients = result.clients;
        renderClients(allClients);
      } catch (error) {
        console.error('Error loading clients:', error);
      }
    }

    function renderClients(clients) {
      const tbody = document.getElementById('clientsTableBody');
      if (clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No clients found</td></tr>';
        return;
      }

      tbody.innerHTML = clients.map(client => `
        <tr>
          <td>${client.name}</td>
          <td>${client.email || '-'}</td>
          <td>${client.phone || '-'}</td>
          <td>${client.country || '-'}</td>
          <td>
            <button onclick="viewClient('${client.id}')" class="btn btn-outline btn-sm">View</button>
            <button onclick="editClient('${client.id}')" class="btn btn-outline btn-sm">Edit</button>
            <button onclick="deleteClient('${client.id}')" class="btn btn-danger btn-sm">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function searchClients() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allClients.filter(client =>
        client.name.toLowerCase().includes(search) ||
        (client.email && client.email.toLowerCase().includes(search))
      );
      renderClients(filtered);
    }

    function openModal(clientId = null) {
      const modal = document.getElementById('clientModal');
      const form = document.getElementById('clientForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('clientId').value = '';

      if (clientId) {
        title.textContent = 'Edit Client';
        const client = allClients.find(c => c.id === clientId);
        if (client) {
          document.getElementById('clientId').value = client.id;
          document.getElementById('clientName').value = client.name;
          document.getElementById('clientEmail').value = client.email || '';
          document.getElementById('clientPhone').value = client.phone || '';
          document.getElementById('clientAddress').value = client.address || '';
          document.getElementById('clientCountry').value = client.country || '';
        }
      } else {
        title.textContent = 'Add Client';
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('clientModal').classList.remove('active');
    }

    async function saveClient(e) {
      e.preventDefault();
      const id = document.getElementById('clientId').value;
      const data = {
        name: document.getElementById('clientName').value,
        email: document.getElementById('clientEmail').value || null,
        phone: document.getElementById('clientPhone').value || null,
        address: document.getElementById('clientAddress').value || null,
        country: document.getElementById('clientCountry').value || null,
      };

      try {
        if (id) {
          await apiCall(`/clients/${id}`, 'PUT', data);
        } else {
          await apiCall('/clients', 'POST', data);
        }
        closeModal();
        loadClients();
      } catch (error) {
        alert('Error saving client: ' + error.message);
      }
    }

    function editClient(id) {
      openModal(id);
    }

    async function deleteClient(id) {
      if (!confirm('Are you sure you want to delete this client?')) return;

      try {
        await apiCall(`/clients/${id}`, 'DELETE');
        loadClients();
      } catch (error) {
        alert('Error deleting client: ' + error.message);
      }
    }

    async function viewClient(id) {
      try {
        const result = await apiCall(`/clients/${id}`);
        const client = result.client;

        let html = `
          <div style="margin-bottom: 1rem;">
            <strong>Name:</strong> ${client.name}<br>
            <strong>Email:</strong> ${client.email || '-'}<br>
            <strong>Phone:</strong> ${client.phone || '-'}<br>
            <strong>Address:</strong> ${client.address || '-'}<br>
            <strong>Country:</strong> ${client.country || '-'}
          </div>
          <h3>Quotes (${client.quotes.length})</h3>
          <table class="table" style="margin-bottom: 1rem;">
            <thead><tr><th>Quote #</th><th>Status</th><th>Total</th></tr></thead>
            <tbody>
              ${client.quotes.map(q => `<tr><td>${q.quoteNumber}</td><td>${q.status}</td><td>${formatCurrency(q.total)}</td></tr>`).join('')}
            </tbody>
          </table>
          <h3>Invoices (${client.invoices.length})</h3>
          <table class="table">
            <thead><tr><th>Invoice #</th><th>Status</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead>
            <tbody>
              ${client.invoices.map(inv => {
                const paid = inv.payments.reduce((sum, p) => sum + p.amount, 0);
                return `<tr><td>${inv.invoiceNumber}</td><td>${inv.status}</td><td>${formatCurrency(inv.total)}</td><td>${formatCurrency(paid)}</td><td>${formatCurrency(inv.total - paid)}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        `;

        document.getElementById('clientDetailContent').innerHTML = html;
        document.getElementById('clientDetailModal').classList.add('active');
      } catch (error) {
        alert('Error loading client details: ' + error.message);
      }
    }

    function closeDetailModal() {
      document.getElementById('clientDetailModal').classList.remove('active');
    }

    document.getElementById('clientForm').addEventListener('submit', saveClient);
    loadClients();
  </script>
</body>
</html>
