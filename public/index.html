<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayShield Dashboard</title>
  <!-- Use a clean professional styling framework via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
      <h1 class="h3 fw-bold text-dark">PayShield Dashboard</h1>
      <p class="text-muted m-0">Live Database Records Overview</p>
    </header>

    <!-- Health Status Alert -->
    <div id="healthStatus" class="alert alert-info" role="alert">
      Checking server status...
    </div>

    <!-- Clients Overview Table Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Clients Overview</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="3" class="text-center py-3">Loading clients...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Payment History Card -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold">Payment History & Metrics</div>
      <div class="card-body">
        <button class="btn btn-primary btn-sm mb-3" onclick="loadMetrics()">Refresh Metrics</button>
        <div class="row text-center mb-3">
          <div class="col">
            <div class="p-3 border bg-white rounded">
              <span class="text-muted d-block small">Total Invoices</span>
              <strong id="totalInvoices" class="h5">-</strong>
            </div>
          </div>
          <div class="col">
            <div class="p-3 border bg-white rounded">
              <span class="text-muted d-block small">Paid</span>
              <strong id="paidInvoices" class="h5 text-success">-</strong>
            </div>
          </div>
          <div class="col">
            <div class="p-3 border bg-white rounded">
              <span class="text-muted d-block small">Outstanding</span>
              <strong id="outstanding" class="h5 text-danger">-</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clean, isolated script block -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      checkHealth();
      loadClients();
      loadMetrics();
    });

    function loadClients() {
      fetch('/api/clients')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('table-body');
          tbody.innerHTML = '';
          const clientList = Array.isArray(data) ? data : (data.clients || []);
          
          if (clientList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3">No clients found</td></tr>';
            return;
          }

          clientList.forEach(client => {
            tbody.innerHTML += `
              <tr>
                <td>${client.id}</td>
                <td>${client.name}</td>
                <td>${client.email}</td>
              </tr>
            `;
          });
        })
        .catch(err => {
          console.error('Error loading clients:', err);
          document.getElementById('table-body').innerHTML = '<tr><td colspan="3" class="text-center text-danger py-3">Error loading client data</td></tr>';
        });
    }

    async function checkHealth() {
      const alertBox = document.getElementById('healthStatus');
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        if (res.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = '✅ PayShield server is running and database is connected.';
        } else {
          throw new Error(data.error || 'Server error');
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = '❌ Connection error: ' + err.message;
      }
    }

    async function loadMetrics() {
      try {
        const res = await fetch('/api/metrics');
        const data = await res.json();
        if (res.ok && data.metrics) {
          document.getElementById('totalInvoices').textContent = data.metrics.totalInvoices;
          document.getElementById('paidInvoices').textContent = data.metrics.paidInvoices;
          document.getElementById('outstanding').textContent = `${data.metrics.outstandingAmount} ${data.organization.currency}`;
        }
      } catch (err) {
        console.error('Metrics error:', err);
      }
    }
  </script>
</body>
</html>
