<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices - PayShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/dashboard" class="navbar-brand">PayShield</a>
      <ul class="navbar-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/clients">Clients</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/quotes">Quotes</a></li>
        <li><a href="/invoices" class="active">Invoices</a></li>
        <li><a href="/payments">Payments</a></li>
        <li><a href="/expenses">Expenses</a></li>
        <li><a href="/cashflow">Cash Flow</a></li>
        <li><a href="/reports">Reports</a></li>
        <li><a href="/insights">Insights</a></li>
        <li><a href="/settings">Settings</a></li>
        <li><button onclick="logout()" class="btn btn-outline btn-sm">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 2rem 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1>Invoices</h1>
      <button onclick="openModal()" class="btn btn-primary">Create Invoice</button>
    </div>

    <div class="card">
      <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <input type="text" id="searchInput" class="form-control" placeholder="Search invoices..." onkeyup="filterInvoices()">
        <select id="statusFilter" class="form-control" style="width: 200px;" onchange="filterInvoices()">
          <option value="">All Statuses</option>
          <option value="DRAFT">Draft</option>
          <option value="PENDING">Pending</option>
          <option value="PARTIAL">Partial</option>
          <option value="PAID">Paid</option>
          <option value="OVERDUE">Overdue</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
      <div id="invoicesList">
        <table class="table">
          <thead>
            <tr>
              <th>Invoice #</th>
              <th>Client</th>
              <th>Status</th>
              <th>Total</th>
              <th>Paid</th>
              <th>Balance</th>
              <th>Due Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="invoicesTableBody">
            <tr><td colspan="8" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Create Invoice</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="invoiceForm">
        <input type="hidden" id="invoiceId">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="invoiceClient">Client *</label>
            <select id="invoiceClient" class="form-control" required>
              <option value="">Select Client</option>
            </select>
          </div>
          <div class="form-group">
            <label for="invoiceDueDate">Due Date</label>
            <input type="date" id="invoiceDueDate" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label>Items</label>
          <div id="invoiceItems">
            <div class="invoice-item" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input type="text" class="form-control item-description" placeholder="Description" required>
              <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
              <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
              <input type="text" class="form-control item-total" readonly value="0.00">
              <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
            </div>
          </div>
          <button type="button" onclick="addItem()" class="btn btn-outline btn-sm" style="margin-top: 0.5rem;">+ Add Item</button>
        </div>
        <div class="form-group">
          <label for="invoiceNotes">Notes</label>
          <textarea id="invoiceNotes" class="form-control" rows="2"></textarea>
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
          <strong>Subtotal: </strong><span id="subtotal">0.00</span><br>
          <strong>Tax (16%): </strong><span id="tax">0.00</span><br>
          <strong>Total: </strong><span id="total">0.00</span>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    checkAuth();
    let allInvoices = [];
    let allClients = [];

    async function loadInvoices() {
      try {
        const [invoicesResult, clientsResult] = await Promise.all([
          apiCall('/invoices'),
          apiCall('/clients'),
        ]);
        allInvoices = invoicesResult.invoices;
        allClients = clientsResult.clients;

        const clientSelect = document.getElementById('invoiceClient');
        clientSelect.innerHTML = '<option value="">Select Client</option>' +
          allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        renderInvoices(allInvoices);
      } catch (error) {
        console.error('Error loading invoices:', error);
      }
    }

    function renderInvoices(invoices) {
      const tbody = document.getElementById('invoicesTableBody');
      if (invoices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No invoices found</td></tr>';
        return;
      }

      const currency = getOrganization()?.currency || 'USD';

      tbody.innerHTML = invoices.map(invoice => {
        const client = allClients.find(c => c.id === invoice.clientId);
        const paid = invoice.payments.reduce((sum, p) => sum + p.amount, 0);
        const statusClass = invoice.status === 'PAID' ? 'badge-success' : invoice.status === 'OVERDUE' ? 'badge-danger' : invoice.status === 'PARTIAL' ? 'badge-warning' : 'badge-info';
        return `
          <tr>
            <td>${invoice.invoiceNumber}</td>
            <td>${client ? client.name : 'Unknown'}</td>
            <td><span class="badge ${statusClass}">${invoice.status}</span></td>
            <td>${formatCurrency(invoice.total, currency)}</td>
            <td>${formatCurrency(paid, currency)}</td>
            <td>${formatCurrency(invoice.balance, currency)}</td>
            <td>${invoice.dueDate ? formatDate(invoice.dueDate) : '-'}</td>
            <td>
              <button onclick="editInvoice('${invoice.id}')" class="btn btn-outline btn-sm">Edit</button>
              <button onclick="deleteInvoice('${invoice.id}')" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterInvoices() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = allInvoices;

      if (search) {
        filtered = filtered.filter(i => i.invoiceNumber.toLowerCase().includes(search));
      }

      if (status) {
        filtered = filtered.filter(i => i.status === status);
      }

      renderInvoices(filtered);
    }

    function openModal() {
      const modal = document.getElementById('invoiceModal');
      const form = document.getElementById('invoiceForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('invoiceId').value = '';
      document.getElementById('invoiceItems').innerHTML = `
        <div class="invoice-item" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;">
          <input type="text" class="form-control item-description" placeholder="Description" required>
          <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
          <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
          <input type="text" class="form-control item-total" readonly value="0.00">
          <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
        </div>
      `;
      calculateTotals();

      title.textContent = 'Create Invoice';
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('invoiceModal').classList.remove('active');
    }

    function addItem() {
      const container = document.getElementById('invoiceItems');
      const itemDiv = document.createElement('div');
      itemDiv.className = 'invoice-item';
      itemDiv.style.cssText = 'display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;';
      itemDiv.innerHTML = `
        <input type="text" class="form-control item-description" placeholder="Description" required>
        <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
        <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
        <input type="text" class="form-control item-total" readonly value="0.00">
        <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
      `;
      container.appendChild(itemDiv);
      attachItemListeners(itemDiv);
    }

    function removeItem(button) {
      const items = document.querySelectorAll('.invoice-item');
      if (items.length > 1) {
        button.parentElement.remove();
        calculateTotals();
      }
    }

    function attachItemListeners(itemDiv) {
      const qty = itemDiv.querySelector('.item-quantity');
      const price = itemDiv.querySelector('.item-price');
      const total = itemDiv.querySelector('.item-total');

      qty.addEventListener('input', () => {
        total.value = (parseFloat(qty.value) * parseFloat(price.value || 0)).toFixed(2);
        calculateTotals();
      });

      price.addEventListener('input', () => {
        total.value = (parseFloat(qty.value) * parseFloat(price.value || 0)).toFixed(2);
        calculateTotals();
      });
    }

    function calculateTotals() {
      const items = document.querySelectorAll('.invoice-item');
      let subtotal = 0;

      items.forEach(item => {
        const qty = parseFloat(item.querySelector('.item-quantity').value) || 0;
        const price = parseFloat(item.querySelector('.item-price').value) || 0;
        subtotal += qty * price;
      });

      const tax = subtotal * 0.16;
      const total = subtotal + tax;

      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('tax').textContent = tax.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    }

    async function saveInvoice(e) {
      e.preventDefault();

      const items = [];
      document.querySelectorAll('.invoice-item').forEach(item => {
        items.push({
          description: item.querySelector('.item-description').value,
          quantity: parseFloat(item.querySelector('.item-quantity').value),
          unitPrice: parseFloat(item.querySelector('.item-price').value),
        });
      });

      const data = {
        clientId: document.getElementById('invoiceClient').value,
        items,
        notes: document.getElementById('invoiceNotes').value || null,
        dueDate: document.getElementById('invoiceDueDate').value || null,
      };

      try {
        await apiCall('/invoices', 'POST', data);
        closeModal();
        loadInvoices();
      } catch (error) {
        alert('Error saving invoice: ' + error.message);
      }
    }

    async function deleteInvoice(id) {
      if (!confirm('Are you sure you want to delete this invoice?')) return;

      try {
        await apiCall(`/invoices/${id}`, 'DELETE');
        loadInvoices();
      } catch (error) {
        alert('Error deleting invoice: ' + error.message);
      }
    }

    document.querySelectorAll('.invoice-item').forEach(attachItemListeners);
    document.getElementById('invoiceForm').addEventListener('submit', saveInvoice);
    loadInvoices();
  </script>
</body>
</html>
