<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | PayShield</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .portal-card { max-width: 600px; margin: 50px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .brand-title { font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>

  <div class="container">
    <div class="portal-card">
      <div class="text-center mb-4">
        <h2 class="brand-title">PayShield Client Portal</h2>
        <p class="text-muted">Fill out the blank form below to submit your invoice details and secure deliverables.</p>
      </div>

      <form id="clientInvoiceForm" onsubmit="submitClientInvoice(event)">
        <div class="mb-3">
          <label class="form-label fw-bold">Your Business / Client Name</label>
          <input type="text" id="clientNameInput" class="form-control" placeholder="e.g. Miri Enterprise Ltd" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Invoice Number</label>
          <input type="text" id="invoiceNumberInput" class="form-control" placeholder="e.g. INV-2026-001" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Amount ($)</label>
          <input type="number" id="invoiceAmountInput" class="form-control" placeholder="e.g. 1500" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Service / Deliverable Description</label>
          <textarea id="serviceDescInput" class="form-control" rows="3" placeholder="Describe the service or milestone details..." required></textarea>
        </div>

        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary btn-lg">Submit Invoice & Lock Escrow</button>
        </div>
      </form>

      <div id="successMessage" class="alert alert-success mt-4 d-none text-center">
        <strong>Success!</strong> Your invoice has been submitted and protected under Deliverable Shield.
      </div>
    </div>
  </div>

  <script>
    async function submitClientInvoice(event) {
      event.preventDefault();
      
      const payload = {
        name: document.getElementById('clientNameInput').value,
        invoiceNumber: document.getElementById('invoiceNumberInput').value,
        amount: parseFloat(document.getElementById('invoiceAmountInput').value),
        description: document.getElementById('serviceDescInput').value
      };

      try {
        // Sends the data directly to your backend API route
        const response = await fetch('/api/invoices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          document.getElementById('clientInvoiceForm').reset();
          document.getElementById('successMessage').classList.remove('d-none');
        } else {
          alert('Error submitting invoice. Please check your inputs.');
        }
      } catch (err) {
        console.error('Submission failed', err);
        alert('Network error while saving record.');
      }
    }
  </script>
</body>
</html>
