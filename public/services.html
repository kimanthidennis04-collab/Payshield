<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services - PayShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/dashboard" class="navbar-brand">PayShield</a>
      <ul class="navbar-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/clients">Clients</a></li>
        <li><a href="/services" class="active">Services</a></li>
        <li><a href="/quotes">Quotes</a></li>
        <li><a href="/invoices">Invoices</a></li>
        <li><a href="/payments">Payments</a></li>
        <li><a href="/expenses">Expenses</a></li>
        <li><a href="/cashflow">Cash Flow</a></li>
        <li><a href="/reports">Reports</a></li>
        <li><a href="/insights">Insights</a></li>
        <li><a href="/settings">Settings</a></li>
        <li><button onclick="logout()" class="btn btn-outline btn-sm">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 2rem 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1>Services</h1>
      <button onclick="openModal()" class="btn btn-primary">Add Service</button>
    </div>

    <div class="card">
      <input type="text" id="searchInput" class="form-control" placeholder="Search services..." style="margin-bottom: 1rem;" onkeyup="searchServices()">
      <div id="servicesList">
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Price</th>
              <th>Currency</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="servicesTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="serviceModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Service</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="serviceForm">
        <input type="hidden" id="serviceId">
        <div class="form-group">
          <label for="serviceName">Name *</label>
          <input type="text" id="serviceName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="serviceDescription">Description</label>
          <textarea id="serviceDescription" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="servicePrice">Price *</label>
          <input type="number" id="servicePrice" class="form-control" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="serviceCurrency">Currency</label>
          <select id="serviceCurrency" class="form-control">
            <option value="USD">USD</option>
            <option value="KES">KES</option>
            <option value="UGX">UGX</option>
            <option value="TZS">TZS</option>
            <option value="RWF">RWF</option>
            <option value="GBP">GBP</option>
            <option value="EUR">EUR</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    checkAuth();
    let allServices = [];

    async function loadServices() {
      try {
        const result = await apiCall('/services');
        allServices = result.services;
        renderServices(allServices);
      } catch (error) {
        console.error('Error loading services:', error);
      }
    }

    function renderServices(services) {
      const tbody = document.getElementById('servicesTableBody');
      if (services.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No services found</td></tr>';
        return;
      }

      tbody.innerHTML = services.map(service => `
        <tr>
          <td>${service.name}</td>
          <td>${service.description || '-'}</td>
          <td>${formatCurrency(service.price, service.currency)}</td>
          <td>${service.currency}</td>
          <td>
            <button onclick="editService('${service.id}')" class="btn btn-outline btn-sm">Edit</button>
            <button onclick="deleteService('${service.id}')" class="btn btn-danger btn-sm">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function searchServices() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allServices.filter(service =>
        service.name.toLowerCase().includes(search) ||
        (service.description && service.description.toLowerCase().includes(search))
      );
      renderServices(filtered);
    }

    function openModal(serviceId = null) {
      const modal = document.getElementById('serviceModal');
      const form = document.getElementById('serviceForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('serviceId').value = '';

      if (serviceId) {
        title.textContent = 'Edit Service';
        const service = allServices.find(s => s.id === serviceId);
        if (service) {
          document.getElementById('serviceId').value = service.id;
          document.getElementById('serviceName').value = service.name;
          document.getElementById('serviceDescription').value = service.description || '';
          document.getElementById('servicePrice').value = service.price;
          document.getElementById('serviceCurrency').value = service.currency;
        }
      } else {
        title.textContent = 'Add Service';
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('serviceModal').classList.remove('active');
    }

    async function saveService(e) {
      e.preventDefault();
      const id = document.getElementById('serviceId').value;
      const data = {
        name: document.getElementById('serviceName').value,
        description: document.getElementById('serviceDescription').value || null,
        price: parseFloat(document.getElementById('servicePrice').value),
        currency: document.getElementById('serviceCurrency').value,
      };

      try {
        if (id) {
          await apiCall(`/services/${id}`, 'PUT', data);
        } else {
          await apiCall('/services', 'POST', data);
        }
        closeModal();
        loadServices();
      } catch (error) {
        alert('Error saving service: ' + error.message);
      }
    }

    function editService(id) {
      openModal(id);
    }

    async function deleteService(id) {
      if (!confirm('Are you sure you want to delete this service?')) return;

      try {
        await apiCall(`/services/${id}`, 'DELETE');
        loadServices();
      } catch (error) {
        alert('Error deleting service: ' + error.message);
      }
    }

    document.getElementById('serviceForm').addEventListener('submit', saveService);
    loadServices();
  </script>
</body>
</html>
