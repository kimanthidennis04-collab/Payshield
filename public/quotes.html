<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes - PayShield</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/dashboard" class="navbar-brand">PayShield</a>
      <ul class="navbar-nav">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/clients">Clients</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/quotes" class="active">Quotes</a></li>
        <li><a href="/invoices">Invoices</a></li>
        <li><a href="/payments">Payments</a></li>
        <li><a href="/expenses">Expenses</a></li>
        <li><a href="/cashflow">Cash Flow</a></li>
        <li><a href="/reports">Reports</a></li>
        <li><a href="/insights">Insights</a></li>
        <li><a href="/settings">Settings</a></li>
        <li><button onclick="logout()" class="btn btn-outline btn-sm">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 2rem 1rem;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1>Quotes</h1>
      <button onclick="openModal()" class="btn btn-primary">Create Quote</button>
    </div>

    <div class="card">
      <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <input type="text" id="searchInput" class="form-control" placeholder="Search quotes..." onkeyup="filterQuotes()">
        <select id="statusFilter" class="form-control" style="width: 200px;" onchange="filterQuotes()">
          <option value="">All Statuses</option>
          <option value="DRAFT">Draft</option>
          <option value="SENT">Sent</option>
          <option value="ACCEPTED">Accepted</option>
          <option value="REJECTED">Rejected</option>
          <option value="EXPIRED">Expired</option>
        </select>
      </div>
      <div id="quotesList">
        <table class="table">
          <thead>
            <tr>
              <th>Quote #</th>
              <th>Client</th>
              <th>Status</th>
              <th>Total</th>
              <th>Valid Until</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="quotesTableBody">
            <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="quoteModal" class="modal">
    <div class="modal-content" style="max-width: 800px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Create Quote</h2>
        <button onclick="closeModal()" class="modal-close">&times;</button>
      </div>
      <form id="quoteForm">
        <input type="hidden" id="quoteId">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="quoteClient">Client *</label>
            <select id="quoteClient" class="form-control" required>
              <option value="">Select Client</option>
            </select>
          </div>
          <div class="form-group">
            <label for="quoteValidUntil">Valid Until</label>
            <input type="date" id="quoteValidUntil" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label>Items</label>
          <div id="quoteItems">
            <div class="quote-item" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input type="text" class="form-control item-description" placeholder="Description" required>
              <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
              <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
              <input type="text" class="form-control item-total" readonly value="0.00">
              <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
            </div>
          </div>
          <button type="button" onclick="addItem()" class="btn btn-outline btn-sm" style="margin-top: 0.5rem;">+ Add Item</button>
        </div>
        <div class="form-group">
          <label for="quoteNotes">Notes</label>
          <textarea id="quoteNotes" class="form-control" rows="2"></textarea>
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
          <strong>Subtotal: </strong><span id="subtotal">0.00</span><br>
          <strong>Tax (16%): </strong><span id="tax">0.00</span><br>
          <strong>Total: </strong><span id="total">0.00</span>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Quote</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
  <script>
    checkAuth();
    let allQuotes = [];
    let allClients = [];

    async function loadQuotes() {
      try {
        const [quotesResult, clientsResult] = await Promise.all([
          apiCall('/quotes'),
          apiCall('/clients'),
        ]);
        allQuotes = quotesResult.quotes;
        allClients = clientsResult.clients;

        const clientSelect = document.getElementById('quoteClient');
        clientSelect.innerHTML = '<option value="">Select Client</option>' +
          allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

        renderQuotes(allQuotes);
      } catch (error) {
        console.error('Error loading quotes:', error);
      }
    }

    function renderQuotes(quotes) {
      const tbody = document.getElementById('quotesTableBody');
      if (quotes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No quotes found</td></tr>';
        return;
      }

      const currency = getOrganization()?.currency || 'USD';

      tbody.innerHTML = quotes.map(quote => {
        const client = allClients.find(c => c.id === quote.clientId);
        const statusClass = quote.status === 'ACCEPTED' ? 'badge-success' : quote.status === 'REJECTED' ? 'badge-danger' : 'badge-info';
        return `
          <tr>
            <td>${quote.quoteNumber}</td>
            <td>${client ? client.name : 'Unknown'}</td>
            <td><span class="badge ${statusClass}">${quote.status}</span></td>
            <td>${formatCurrency(quote.total, currency)}</td>
            <td>${quote.validUntil ? formatDate(quote.validUntil) : '-'}</td>
            <td>
              <button onclick="editQuote('${quote.id}')" class="btn btn-outline btn-sm">Edit</button>
              <button onclick="convertToInvoice('${quote.id}')" class="btn btn-success btn-sm" ${quote.status !== 'ACCEPTED' ? 'disabled' : ''}>Convert to Invoice</button>
              <button onclick="deleteQuote('${quote.id}')" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterQuotes() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      let filtered = allQuotes;

      if (search) {
        filtered = filtered.filter(q => q.quoteNumber.toLowerCase().includes(search));
      }

      if (status) {
        filtered = filtered.filter(q => q.status === status);
      }

      renderQuotes(filtered);
    }

    function openModal(quoteId = null) {
      const modal = document.getElementById('quoteModal');
      const form = document.getElementById('quoteForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('quoteId').value = '';
      document.getElementById('quoteItems').innerHTML = `
        <div class="quote-item" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;">
          <input type="text" class="form-control item-description" placeholder="Description" required>
          <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
          <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
          <input type="text" class="form-control item-total" readonly value="0.00">
          <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
        </div>
      `;
      calculateTotals();

      title.textContent = 'Create Quote';
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('quoteModal').classList.remove('active');
    }

    function addItem() {
      const container = document.getElementById('quoteItems');
      const itemDiv = document.createElement('div');
      itemDiv.className = 'quote-item';
      itemDiv.style.cssText = 'display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-bottom: 0.5rem;';
      itemDiv.innerHTML = `
        <input type="text" class="form-control item-description" placeholder="Description" required>
        <input type="number" class="form-control item-quantity" placeholder="Qty" value="1" min="1" required>
        <input type="number" class="form-control item-price" placeholder="Price" step="0.01" required>
        <input type="text" class="form-control item-total" readonly value="0.00">
        <button type="button" onclick="removeItem(this)" class="btn btn-danger btn-sm">X</button>
      `;
      container.appendChild(itemDiv);
      attachItemListeners(itemDiv);
    }

    function removeItem(button) {
      const items = document.querySelectorAll('.quote-item');
      if (items.length > 1) {
        button.parentElement.remove();
        calculateTotals();
      }
    }

    function attachItemListeners(itemDiv) {
      const qty = itemDiv.querySelector('.item-quantity');
      const price = itemDiv.querySelector('.item-price');
      const total = itemDiv.querySelector('.item-total');

      qty.addEventListener('input', () => {
        total.value = (parseFloat(qty.value) * parseFloat(price.value || 0)).toFixed(2);
        calculateTotals();
      });

      price.addEventListener('input', () => {
        total.value = (parseFloat(qty.value) * parseFloat(price.value || 0)).toFixed(2);
        calculateTotals();
      });
    }

    function calculateTotals() {
      const items = document.querySelectorAll('.quote-item');
      let subtotal = 0;

      items.forEach(item => {
        const qty = parseFloat(item.querySelector('.item-quantity').value) || 0;
        const price = parseFloat(item.querySelector('.item-price').value) || 0;
        subtotal += qty * price;
      });

      const tax = subtotal * 0.16;
      const total = subtotal + tax;

      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('tax').textContent = tax.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    }

    async function saveQuote(e) {
      e.preventDefault();

      const items = [];
      document.querySelectorAll('.quote-item').forEach(item => {
        items.push({
          description: item.querySelector('.item-description').value,
          quantity: parseFloat(item.querySelector('.item-quantity').value),
          unitPrice: parseFloat(item.querySelector('.item-price').value),
        });
      });

      const data = {
        clientId: document.getElementById('quoteClient').value,
        items,
        notes: document.getElementById('quoteNotes').value || null,
        validUntil: document.getElementById('quoteValidUntil').value || null,
      };

      try {
        await apiCall('/quotes', 'POST', data);
        closeModal();
        loadQuotes();
      } catch (error) {
        alert('Error saving quote: ' + error.message);
      }
    }

    async function convertToInvoice(id) {
      if (!confirm('Convert this quote to an invoice?')) return;

      try {
        await apiCall(`/quotes/${id}/convert-to-invoice`, 'POST');
        loadQuotes();
        alert('Quote converted to invoice successfully');
      } catch (error) {
        alert('Error converting quote: ' + error.message);
      }
    }

    async function deleteQuote(id) {
      if (!confirm('Are you sure you want to delete this quote?')) return;

      try {
        await apiCall(`/quotes/${id}`, 'DELETE');
        loadQuotes();
      } catch (error) {
        alert('Error deleting quote: ' + error.message);
      }
    }

    document.querySelectorAll('.quote-item').forEach(attachItemListeners);
    document.getElementById('quoteForm').addEventListener('submit', saveQuote);
    loadQuotes();
  </script>
</body>
</html>
